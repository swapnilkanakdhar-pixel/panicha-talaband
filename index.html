<h2 style="margin-top:14px">${t("gw")}</h2><div class="mt"><i style="left:${Math.min(c.stage,100)*.96}%"></i></div><b>${c.stage>=999?"–":Math.round(c.stage)+"%"}</b></div>
<div class="cd"><h2>${t("cp")}</h2>${Object.keys(c.cr).filter(k=>cA(k)>0).sort((a,b)=>c.cr[b]-c.cr[a]).map(k=>`<div class="cr"><div><span>${cN(k)} (${cA(k)} ${lang?"हे.":"ha"})</span><b>${LL(c.cr[k])}</b></div><i style="width:${c.cr[k]/cmax*100}%"></i></div>`).join("")}</div>
<div class="cd"><h2>${t("try")}</h2><div class="tr"><button class="bt" data-a="1">${t("t1")}</button><button class="bt" data-a="2">${t("t2")}</button><button class="bt" data-a="3">${t("t3")}</button><button class="bt p" data-a="0">${t("t4")}</button></div></div>`}
document.addEventListener("input",e=>{if(e.target.dataset.v){V[e.target.dataset.v]=e.target.value;vline();return}});
document.addEventListener("input",e=>{const k=e.target.dataset.k;if(k&&e.target.type==="range"){S[k]=+e.target.value;$("#o-"+k).textContent=S[k];show()}});
document.addEventListener("click",e=>{const d=e.target.dataset;
if(d.l!==undefined){lang=+d.l;build()}
if(d.d){const r=$("#s-"+d.k),v=Math.min(+r.max,Math.max(+r.min,S[d.k]+(+d.d)*(+r.step)));S[d.k]=v;sync()}
if(d.a==="1"){S.cane=Math.round(S.cane/2/5)*5;sync()}
if(d.a==="2"){S.drip=Math.max(S.drip,50);sync()}
if(d.a==="3"){S.pond=Math.min(200,S.pond+10);sync()}
if(d.a==="0"){S={...D,ex:[]};build()}
if(d.xd){const e=S.ex[+d.x];e.ha=Math.min(500,Math.max(0,e.ha+(+d.xd)));$("#xs"+d.x).value=e.ha;$("#xo"+d.x).textContent=e.ha;show()}
if(d.xr!==undefined){S.ex.splice(+d.xr,1);build()}
if(d.add){const v=$("#csel").value;let n,m;if(v==="o"){const nm=$("#on").value.trim()||(lang?"इतर पीक":"Other crop");n=[nm,nm];m=+$("#om").value||300}else{const c=CAT[+v];n=[c[0],c[1]];m=c[2]}S.ex.push({name:n,net:m,ha:5});build()}});
document.addEventListener("input",e=>{const i=e.target.dataset.x;if(i!==undefined&&e.target.type==="range"){S.ex[+i].ha=+e.target.value;$("#xo"+i).textContent=S.ex[+i].ha;show()}});
document.addEventListener("change",e=>{if(e.target.id==="csel")$("#oth").hidden=e.target.value!=="o"});
build();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
